name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Check module version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          module="$(sed -nE "s/.*'CUBEPATH_ADDON_VERSION', '([^']+)'.*/\1/p" addons/cubepath/cubepath.php)"
          if [ "$tag" != "$module" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match module version $module in addons/cubepath/cubepath.php"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build archive
        id: build
        run: |
          archive="$(bin/build-release.sh "$GITHUB_REF_NAME")"
          # Unversioned copy so releases/latest/download/whmcs-cubepath.zip always points at the newest build.
          cp "$archive" "$(dirname "$archive")/whmcs-cubepath.zip"
          {
            echo "files<<EOF"
            echo "$archive"
            echo "$(dirname "$archive")/whmcs-cubepath.zip"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.files }}
          generate_release_notes: true
